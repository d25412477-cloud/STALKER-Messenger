<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STALKERGRAM</title>
<style>
* {box-sizing:border-box}
body {
 margin:0;
 background:#080b08;
 color:#d4dfc8;
 font-family:Arial,sans-serif;
}
header {
 background:#111811;
 padding:20px;
 border-bottom:1px solid #34452d;
 text-align:center;
}
h1 {
 color:#91bd59;
 letter-spacing:4px;
}
.status {
 color:#81916e;
 font-size:13px;
}
main {padding:20px}
.card {
 background:#151e14;
 border:1px solid #34452d;
 border-radius:10px;
 padding:18px;
 margin-bottom:15px;
}
.card h3 {color:#a6d36d}
button {
 background:#526e35;
 color:white;
 border:0;
 padding:12px;
 border-radius:6px;
 width:100%;
 font-size:15px;
}
footer {
 position:fixed;
 bottom:0;
 width:100%;
 background:#111811;
 display:flex;
 justify-content:space-around;
 padding:15px 5px;
 border-top:1px solid #34452d;
}
footer span {color:#a6c17f;font-size:13px}
</style>
</head>
<body>

<header>
<h1>☢ STALKERGRAM</h1>
<div class="status">СВЯЗЬ С ЗОНОЙ УСТАНОВЛЕНА</div>
</header>

<main>
<div class="card">
<h3>Добро пожаловать, сталкер!</h3>
<p>Зона ждёт тебя. Здесь начинается твоя история.</p>
<button>Мой профиль</button>
</div>

<div class="card">
<h3>📡 Сообщения</h3>
<p>Пока нет новых сообщений.</p>
</div>

<div class="card">
<h3>👥 Сталкеры</h3>
<p>Поиск новых пользователей скоро появится.</p>
</div>
</main>

<footer>
<span>⌂ Главная</span>
<span>✉ Чаты</span>
<span>☻ Профиль</span>
</footer>

</body>
</html>
